<style>
/* Layout: one column; search on top, then a crate of photos/covers that open into detail pages */
:root{
  --bg:#eef0f4; --surface:#ffffff; --ink:#15182a; --muted:#5d6278; --line:#d7dae4;
  --accent:#2d3fd6; --accent-ink:#ffffff; --danger:#c23a3a; --ok:#1f8a55;
  --display:"Syne","Avenir Next","Segoe UI",sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-panel:12px; --r-pic:4px; --r-btn:6px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12141f; --surface:#1b1e2d; --ink:#e9ebf4; --muted:#9a9fb7; --line:#2c3045;
  --accent:#8a97ff; --accent-ink:#0f1224; --danger:#ff8080; --ok:#5fd39a; color-scheme:dark}}
/* Themes each person can pick. Each one is a single fixed look. */
:root[data-skin="midnight"]{
  --bg:#17122b; --surface:#221a3d; --ink:#f2edff; --muted:#a99cc9; --line:#352a5a;
  --accent:#ff7a59; --accent-ink:#1d1124; --danger:#ff8f8f; --ok:#6fe0a8;
  --display:"Syne","Avenir Next",sans-serif; color-scheme:dark}
:root[data-skin="cassette"]{
  --bg:#f3d9a4; --surface:#fff3d9; --ink:#2b1d12; --muted:#7a5b3a; --line:#e0bc7c;
  --accent:#d4451c; --accent-ink:#fff3d9; --danger:#a8261b; --ok:#2f7d4f;
  --display:"Bungee","Arial Black",sans-serif; --r-panel:4px; --r-pic:2px; --r-btn:3px; color-scheme:light}
:root[data-skin="liner"]{
  --bg:#e6ebe5; --surface:#f6f8f4; --ink:#17251d; --muted:#57665c; --line:#c3cdc4;
  --accent:#cf2f2a; --accent-ink:#ffffff; --danger:#b3221d; --ok:#1d7a4c;
  --display:"Space Mono",ui-monospace,monospace; --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif; --mono:"Space Mono",ui-monospace,monospace;
  --r-panel:0; --r-pic:0; --r-btn:0; color-scheme:light}
:root[data-skin="pop"]{
  --bg:#efe6ff; --surface:#ffffff; --ink:#2a1a4d; --muted:#6c5a92; --line:#dccdfa;
  --accent:#f0408f; --accent-ink:#ffffff; --danger:#d62e4a; --ok:#14a074;
  --display:"Fredoka","Nunito",sans-serif; --body:"Nunito","Helvetica Neue",Arial,sans-serif;
  --r-panel:22px; --r-pic:18px; --r-btn:99px; color-scheme:light}
:root[data-skin="lofi"]{
  --bg:#dfe5d6; --surface:#f2f5ed; --ink:#343d30; --muted:#68725f; --line:#c6cfba;
  --accent:#b9704f; --accent-ink:#ffffff; --danger:#b23a2e; --ok:#3f7d4e;
  --display:"Fredoka","Nunito",sans-serif; --body:"Nunito","Helvetica Neue",Arial,sans-serif;
  --r-panel:20px; --r-pic:16px; --r-btn:99px; color-scheme:light}
:root[data-skin="synth"]{
  --bg:#1b0b3a; --surface:#2a1257; --ink:#ffe9fb; --muted:#c7a3dc; --line:#46207c;
  --accent:#2ee6ff; --accent-ink:#1b0b3a; --danger:#ff6b8b; --ok:#5dffb0;
  --display:"Bungee","Arial Black",sans-serif; --r-panel:6px; --r-pic:4px; --r-btn:4px; color-scheme:dark}
:root[data-skin="synth"]{min-height:100%;background:linear-gradient(180deg,#1b0b3a 0%,#1b0b3a 50%,#4a0f5c 82%,#8a1660 100%)}
:root[data-skin="synth"] body{background:transparent}
:root[data-skin="synth"] h1{color:#ffd23f;text-shadow:3px 3px 0 #ff2e88}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
img{max-width:100%;display:block}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.02;font-weight:800;overflow-wrap:anywhere}
h2{font-size:1.15rem;font-weight:700}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:800 18px/1 var(--display);letter-spacing:-.01em;align-self:flex-start}
.brand svg{width:34px;height:34px;flex:none;transition:transform .25s ease}
.brand:hover svg{transform:rotate(-8deg)}
.brand .band{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round}.brand .cup{fill:var(--accent)}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
a{color:inherit}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 13px var(--mono)}
.crumbs a{color:var(--accent);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.head{display:flex;flex-direction:column;gap:10px;min-width:0}
.stats{display:flex;gap:18px;flex-wrap:wrap;font:500 13px var(--mono);color:var(--muted)}
.stats b{color:var(--ink);font-weight:500}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-btn);padding:11px 14px;width:100%}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:600 14px var(--body);border:0;border-radius:var(--r-btn);padding:8px 14px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
button.ghost:hover{color:var(--ink)}
button.danger{background:transparent;color:var(--danger);border:1px solid currentColor}
button.danger.armed{background:var(--danger);color:var(--surface)}
button.added{background:transparent;color:var(--ok);border:1px solid currentColor;cursor:default}
.search{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);padding:14px}
.search input{background:var(--bg)}
.results{display:flex;flex-direction:column;max-height:420px;overflow-y:auto}
.result{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 4px;border-top:1px solid var(--line)}
.result:first-child{border-top:0}
.result .thumb{width:52px;height:52px;border-radius:var(--r-pic);object-fit:cover;background:var(--line)}
.result.artist .thumb{border-radius:50%}
.result .t{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.result .s{font:12px var(--mono);color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.ph{display:grid;place-items:center;background:var(--line);color:var(--muted);font:700 1.6rem var(--display)}
.result .ph{font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;min-width:0}
.pic{aspect-ratio:1;width:100%;max-width:100%;object-fit:cover;border-radius:var(--r-pic);background:var(--line);
  box-shadow:0 1px 0 var(--line),0 8px 20px -12px rgba(10,14,40,.55);transition:transform .18s ease}
.card.artist .pic{border-radius:50%}
.card:hover .pic{transform:translateY(-3px)}
.card .t{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.card .s{font:12px var(--mono);color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:var(--r-panel);padding:28px;color:var(--muted);text-align:center}
.hero{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:24px;align-items:end}
.hero .pic{max-width:220px}
.hero.artist .pic{border-radius:50%}
@media (max-width:560px){.hero{grid-template-columns:minmax(0,1fr)}.hero .pic{max-width:180px}}
.tracks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.tracks li{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.tracks .n,.tracks .d{font:13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.notice{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);padding:10px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 12px var(--mono);border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:transparent;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
footer{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}
footer a{color:var(--muted)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--body);color:#fff;flex:none}
.who .name{font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);padding:16px;display:flex;flex-direction:column;gap:14px}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.skin{display:flex;flex-direction:column;gap:8px;text-align:left;padding:10px;border-radius:10px;background:transparent;color:var(--ink);border:2px solid var(--line)}
.skin[aria-pressed="true"]{border-color:var(--accent)}
.skin .sw{display:grid;grid-template-columns:2fr 1fr 1fr;height:44px;border-radius:6px;overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.skin .nm{font-weight:600}.skin .ds{font-size:12px;color:var(--muted);font-weight:400}
.auth{max-width:380px;width:100%;margin:4vh auto 0;display:flex;flex-direction:column;gap:22px;align-items:stretch;text-align:center}
.auth.tt{max-width:860px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:center;margin-top:2vh}
.auth.tt .side{display:flex;flex-direction:column;gap:18px;min-width:0}
.auth.tt .sub{margin:0;color:var(--muted)}
@media (min-width:760px){.auth.tt{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px}}
.deck{position:relative;width:min(340px,72vw);aspect-ratio:1;margin:0 auto}
.deck .plinth{position:absolute;inset:-7%;border-radius:var(--r-panel);background:var(--surface);border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(0,0,0,.55)}
.deck .platter{position:absolute;inset:0;border-radius:50%;background:#0c0c0e;box-shadow:0 0 0 3px var(--line)}
.deck .vinyl{position:absolute;inset:3%;border-radius:50%;background:repeating-radial-gradient(circle,#141416 0 2px,#202024 2px 4px);will-change:transform}
.deck .label{position:absolute;inset:34%;border-radius:50%;
  background:conic-gradient(var(--accent) 0 80%,var(--accent-ink) 80% 84%,var(--accent) 84%);display:grid;place-items:center}
.deck .label i{width:9%;height:9%;border-radius:50%;background:#e8e8ec}
.deck .label b{position:absolute;top:22%;font:700 9px var(--mono);letter-spacing:.14em;color:var(--accent-ink)}
.deck .sheen{position:absolute;inset:3%;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 20deg,transparent 0 8%,rgba(255,255,255,.13) 13%,transparent 19% 58%,rgba(255,255,255,.09) 63%,transparent 69%)}
.deck .pivot{position:absolute;top:-3%;right:-3%;width:16%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#e6e8ee 0 30%,#9aa0ad 32% 100%);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.deck .arm{position:absolute;top:3%;right:4.5%;width:4%;height:66%;transform-origin:50% 0;transform:rotate(3deg);
  transition:transform .7s cubic-bezier(.3,1.35,.5,1);background:linear-gradient(90deg,#8d93a0,#eef0f5,#8d93a0);border-radius:6px}
.deck .arm .head{position:absolute;bottom:-9%;left:-90%;width:280%;height:13%;background:var(--ink);border-radius:4px}
.deck .arm.play{transform:rotate(15deg)}
.deck.scratch .vinyl{filter:brightness(1.15)}
.auth.tt .dots span.on{background:var(--accent);border-color:var(--accent)}
.auth h1{font-size:clamp(1.8rem,7vw,2.4rem)}
.dots{display:flex;gap:14px;justify-content:center;height:18px}
.dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots span.on{background:var(--ink);border-color:var(--ink)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto;width:100%}
.pad button{font:600 24px var(--body);aspect-ratio:1.4;border-radius:var(--r-panel);background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.pad button:hover{border-color:var(--accent)}
.pad button.blank{visibility:hidden}
.pad button.back{font-size:18px;color:var(--muted)}
.err{color:var(--danger);font-size:14px;min-height:1.4em;margin:0}
.form{display:flex;flex-direction:column;gap:14px;text-align:left}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.link{background:none;color:var(--accent);padding:4px;font-weight:600}
.pinbox{letter-spacing:.6em;font:600 20px var(--mono);text-align:center}
@media (prefers-reduced-motion:reduce){.dots.shake{animation:none}.deck .arm{transition:none}}
@media (prefers-reduced-motion:reduce){.brand svg{transition:none}.pic{transition:none}.card:hover .pic{transform:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="import-file" accept="application/json" hidden>

<script>
(function(){
"use strict";
const app = document.getElementById('app');
const KEY = 'listening-log-v3', OLD_KEY = 'listening-log-v2';

/* ---------- profiles + libraries (this browser) ---------- */
let store = { users:{}, libs:{} };
try{ const raw = localStorage.getItem(KEY); if(raw) store = JSON.parse(raw); }catch(e){}
store.users = store.users || {}; store.libs = store.libs || {};
let me = null, lib = null;
try{ me = sessionStorage.getItem('ll-user'); }catch(e){}
function signIn(id){
  me = id; store.libs[id] = store.libs[id] || {artists:{}, albums:{}}; lib = store.libs[id];
  lib.artists = lib.artists || {}; lib.albums = lib.albums || {};
  store.lastSkin = store.users[id].skin || 'crate';
  try{ sessionStorage.setItem('ll-user', id); }catch(e){}
  applySkin();
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
  if(store.users[id].online) startSync(id);
}
function signOut(){
  stopSync(); me = null; lib = null; try{ sessionStorage.removeItem('ll-user'); }catch(e){}
  Object.assign(ui, {q:'', results:[], notice:'', showThemes:false, auth:{mode:'login', pin:'', err:''}});
  history.replaceState(null,'',location.pathname+location.search); applySkin(); render();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){ flash('Couldn’t save in this browser. Check that site storage is allowed.'); }
  if(me && store.users[me] && store.users[me].online) queuePush();
}

/* ---------- online accounts (Firebase database, no Google sign-in) ----------
   An account lives at accounts/<key>, where key = SHA-256 of the name and PIN.
   Knowing the name and PIN is what opens it; this device keeps a copy so it also works offline. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBe9-oMPb6iUAmLCNuXDaOLBNqNB5WmOx8",
  authDomain: "listening-log-c53a0.firebaseapp.com",
  projectId: "listening-log-c53a0",
  storageBucket: "listening-log-c53a0.firebasestorage.app",
  messagingSenderId: "18036390176",
  appId: "1:18036390176:web:9769268847a559ba92ff45"
};
const FIREBASE_VERSION = '10.12.2';
const net = { ready:null, db:null, unsub:null, timer:0, sent:'' };
function loadScript(src){
  return new Promise((ok,fail)=>{ const t=document.createElement('script'); t.src=src; t.async=false; t.onload=ok; t.onerror=fail; document.head.appendChild(t); });
}
function connect(){
  if(!net.ready){
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
    net.ready = Promise.all(['app','firestore'].map(n=>loadScript(base+`firebase-${n}-compat.js`)))
      .then(()=>{ if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG); net.db = firebase.firestore(); return net.db; })
      .catch(e=>{ net.ready = null; throw e; });
  }
  return net.ready;
}
const normName = n => String(n).trim().replace(/\s+/g,' ').toLowerCase();
async function sha(text){
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
const accountKey = (name, pin) => sha('listening-log|account|' + normName(name) + '|' + pin);
const nameKey = name => sha('listening-log|name|' + normName(name));
const OFFLINE = 'You need an internet connection for this. Connect and try again.';
function accountDoc(u, l){
  return {name:u.name, skin:u.skin||'synth', artists:(l&&l.artists)||{}, albums:(l&&l.albums)||{}, createdAt:u.createdAt||Date.now(), updatedAt:Date.now()};
}
function remember(key, d){
  store.users[key] = {id:key, name:d.name, skin:d.skin||'synth', online:true, createdAt:d.createdAt||Date.now(), dirty:false};
  store.libs[key] = {artists:d.artists||{}, albums:d.albums||{}};
}
// create a new online account; status is 'ok', 'taken' (name used by someone else) or 'mine' (same name and PIN already exist)
async function createAccount(name, pin, library, skin){
  const db = await connect();
  const key = await accountKey(name, pin), nk = await nameKey(name);
  const existing = await db.collection('accounts').doc(key).get();
  if(existing.exists) return {status:'mine', key, data:existing.data()};
  const taken = await db.collection('names').doc(nk).get();
  if(taken.exists) return {status:'taken'};
  await db.collection('names').doc(nk).set({createdAt:Date.now()});
  const u = {name:name.trim().replace(/\s+/g,' '), skin:skin||'synth', createdAt:Date.now()};
  const d = accountDoc(u, library);
  await db.collection('accounts').doc(key).set(d);
  return {status:'ok', key, data:d};
}
function startSync(key){
  stopSync();
  connect().then(db=>{
    if(me!==key) return;
    net.unsub = db.collection('accounts').doc(key).onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites || me!==key) return;
      const u = store.users[key]; if(!u) return;
      if(!snap.exists){ queuePush(true); return; }                    // not online yet: upload what this device has
      const d = snap.data(), remote = {artists:d.artists||{}, albums:d.albums||{}}, rj = JSON.stringify(remote);
      if(rj === net.sent && !u.dirty) return;                        // our own save coming back
      if(u.dirty){
        // changes made here while offline: keep both sides, then save
        const l = store.libs[key];
        store.libs[key] = {artists:{...remote.artists, ...l.artists}, albums:{...remote.albums, ...l.albums}};
        lib = store.libs[key]; queuePush(true);
      } else {
        net.sent = rj; store.libs[key] = remote; lib = store.libs[key];
        if(d.skin && d.skin!==u.skin){ u.skin = d.skin; store.lastSkin = d.skin; applySkin(); }
        try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
      }
      render();
    }, ()=>{});
  }).catch(()=>{});
}
function stopSync(){ if(net.unsub){ net.unsub(); net.unsub = null; } clearTimeout(net.timer); }
function queuePush(now){
  const key = me, u = store.users[key]; if(!u || !u.online) return;
  u.dirty = true;
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
  clearTimeout(net.timer);
  net.timer = setTimeout(async ()=>{
    try{
      const db = await connect();
      const d = accountDoc(u, store.libs[key]);
      net.sent = JSON.stringify({artists:d.artists, albums:d.albums});
      await db.collection('accounts').doc(key).set(d);
      u.dirty = false; try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
    }catch(e){ /* stays marked as unsaved and goes up on the next change or login */ }
  }, now ? 0 : 600);
}

/* ---------- PIN hashing (stored as a salted hash, never as the PIN itself) ---------- */
async function hashPin(pin, salt){
  const data = new TextEncoder().encode(salt+':'+pin);
  if(window.crypto && crypto.subtle){
    try{ const h = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join(''); }catch(e){}
  }
  let h = 2166136261; for(const c of data){ h ^= c; h = Math.imul(h, 16777619); } return 'f'+(h>>>0).toString(16);
}
async function findByPin(pin){
  for(const u of Object.values(store.users)){
    if(u.online){ if(await accountKey(u.name, pin) === u.id) return u; }
    else if(await hashPin(pin, u.salt) === u.pinHash) return u;
  }
  return null;
}
// a profile from the older, this-device-only version: move it online the first time its PIN is used
async function upgradeProfile(u, pin){
  const library = store.libs[u.id] || {artists:{}, albums:{}};
  let r;
  try{ r = await createAccount(u.name, pin, library, u.skin); }catch(e){ return u.id; }   // offline: keep using it here, try again next time
  if(r.status==='taken'){ ui.carry = {from:u.id}; return null; }
  const d = r.data;
  if(r.status==='mine'){ d.artists = {...(d.artists||{}), ...library.artists}; d.albums = {...(d.albums||{}), ...library.albums}; }
  delete store.users[u.id]; delete store.libs[u.id];
  remember(r.key, d); if(r.status==='mine') store.users[r.key].dirty = true;
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
  return r.key;
}

/* ---------- music data: Apple Music (iTunes) catalogue ---------- */
// Both are loaded with JSONP (a <script> tag), so no API key or server is needed.
let cbN = 0;
function jsonp(url, params){
  return new Promise((resolve,reject)=>{
    const cb = '__cb' + (++cbN) + Date.now();
    const qs = new URLSearchParams({...params, callback:cb}).toString();
    const s = document.createElement('script');
    const done = () => { delete window[cb]; s.remove(); clearTimeout(t); };
    const t = setTimeout(()=>{ done(); reject(new Error('timeout')); }, 10000);
    window[cb] = d => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error('network')); };
    s.src = url + '?' + qs;
    document.head.appendChild(s);
  });
}
const dz = (path, params={}) => jsonp('https://api.deezer.com'+path, {...params, output:'jsonp'})
  .then(d => { if(d && d.error) throw new Error(d.error.message||'error'); return d; });
const it = (path, params={}) => jsonp('https://itunes.apple.com'+path, params);
const isApple = id => String(id).startsWith('it');
const art = (u,n) => u ? u.replace(/\/\d+x\d+bb\./, `/${n}x${n}bb.`) : '';
let source = 'apple';            // Apple Music catalogue for everyone; Deezer code stays only for albums saved by older versions
function appleAlbum(c){
  let title = c.collectionName || '', type = 'album';
  if(/ - Single$/.test(title)){ type='single'; title=title.replace(/ - Single$/,''); }
  else if(/ - EP$/.test(title)){ type='ep'; title=title.replace(/ - EP$/,''); }
  else if(c.collectionType==='Compilation') type='compile';
  return {id:'it'+c.collectionId, title, cover_medium:art(c.artworkUrl100,250), cover_xl:art(c.artworkUrl100,1000),
    release_date:(c.releaseDate||'').slice(0,10), record_type:type, link:c.collectionViewUrl};
}
async function searchArtists(q){
  if(source==='deezer'){
    try{ const d = await dz('/search/artist', {q, limit:12}); return d.data || []; }
    catch(e){ source = 'apple'; }
  }
  const d = await it('/search', {term:q, entity:'musicArtist', limit:12});
  return (d.results||[]).map(a=>({id:'it'+a.artistId, name:a.artistName, genre:a.primaryGenreName, link:a.artistLinkUrl}));
}
async function artistPictures(list){   // Apple has no artist photos, so use each artist's latest album cover
  list = list.filter(a=>isApple(a.id) && !a.picture_medium);
  if(list.length){
    try{
      const r = await it('/lookup', {id:list.map(a=>a.id.slice(2)).join(','), entity:'album', limit:1, sort:'recent'});
      for(const x of r.results||[]){
        if(x.wrapperType!=='collection') continue;
        const a = list.find(y=>y.id==='it'+x.artistId);
        if(a && !a.picture_medium){ a.picture_medium = art(x.artworkUrl100,250); a.picture_xl = art(x.artworkUrl100,600); }
      }
    }catch(e){}
  }
  return list;
}
async function discography(id){
  if(isApple(id)){
    const d = await it('/lookup', {id:id.slice(2), entity:'album', limit:200});
    return (d.results||[]).filter(x=>x.wrapperType==='collection').map(appleAlbum);
  }
  let all = [], idx = 0;
  for(let page=0; page<5; page++){
    const d = await dz('/artist/'+id+'/albums', {limit:100, index:idx});
    all = all.concat(d.data||[]);
    if(!d.next || !(d.data||[]).length) break;
    idx += 100;
  }
  return all;
}
async function albumInfo(id){
  if(isApple(id)){
    const d = await it('/lookup', {id:id.slice(2), entity:'song'});
    const rs = d.results||[], c = rs.find(x=>x.wrapperType==='collection') || {};
    const tracks = rs.filter(x=>x.wrapperType==='track')
      .sort((a,b)=>((a.discNumber||1)-(b.discNumber||1)) || ((a.trackNumber||0)-(b.trackNumber||0)))
      .map(t=>({title:t.trackName, duration:t.trackTimeMillis ? Math.round(t.trackTimeMillis/1000) : null}));
    return {tracks, nb:c.trackCount||tracks.length, duration:tracks.reduce((s,t)=>s+(t.duration||0),0),
      label:(c.copyright||'').replace(/^[℗©]\s*\d{4}\s*/,'')};
  }
  const d = await dz('/album/'+id);
  return {tracks:(d.tracks && d.tracks.data || []).map(t=>({title:t.title, duration:t.duration})), nb:d.nb_tracks, duration:d.duration, label:d.label};
}

const plural = (n,w) => `${n} ${w}${n===1?'':'s'}`;
const fans = n => n>=1e6 ? (n/1e6).toFixed(n>=1e7?0:1)+'M fans' : n>=1e3 ? Math.round(n/1e3)+'K fans' : (n||0)+' fans';

const fmtTotal = s => { if(!s) return ''; const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h?`${h} h ${m} min`:`${m} min`; };

    <div class="dots" id="dots">${dotsHTML()}</div>
    <p class="err" role="alert" id="auth-err">${esc(locked?'Too many wrong tries. Wait 30 seconds and try again.':a.err)}</p>
    <div class="pad" role="group" aria-label="PIN keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-digit="${n}">${n}</button>`).join('')}
      <button type="button" class="blank" tabindex="-1" aria-hidden="true"></button>
      <button type="button" data-digit="0">0</button>
      <button type="button" class="back" id="pin-back" aria-label="Delete last digit">⌫</button>
    </div>
    <div class="row" style="justify-content:center"><button type="button" class="link" id="to-signin">Using a new device? Sign in</button>
      <button type="button" class="link" id="to-create">Create an account</button></div>
    ${installBtn()}
    </div>
  </div>`;
}
const dotsHTML = () => [0,1,2,3].map(i=>`<span class="${i<ui.auth.pin.length?'on':''}"></span>`).join('');

/* ---------- the turntable: speed follows how many digits are typed ---------- */
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEEDS = [18, 60, 120, 190, 260];           // degrees per second for 0..4 digits
const spin = {angle:0, speed:18, target:18, raf:0, last:0};
function spinFrame(t){
  const v = document.getElementById('vinyl');
  if(!v){ spin.raf = 0; return; }
  const dt = spin.last ? Math.min(.05, (t-spin.last)/1000) : 0; spin.last = t;
  spin.speed += (spin.target - spin.speed) * Math.min(1, dt*3);
  spin.angle = (spin.angle + spin.speed*dt) % 360;
  v.style.transform = `rotate(${spin.angle}deg)`;
  spin.raf = requestAnimationFrame(spinFrame);
}
function startSpin(){ if(reduceMotion || spin.raf) return; spin.last = 0; spin.raf = requestAnimationFrame(spinFrame); }
function updateLogin(){
  const d = document.getElementById('dots'); if(d){ d.classList.remove('shake'); d.innerHTML = dotsHTML(); }
  const e = document.getElementById('auth-err'); if(e) e.textContent = ui.auth.err;
  spin.target = SPEEDS[ui.auth.pin.length] || SPEEDS[0];
}
async function pushDigit(d){
  const a = ui.auth;
  if(Date.now() < ui.lockUntil || a.pin.length>=4 || ui.checking) return;
  a.pin += d; a.err=''; updateLogin();
  if(a.pin.length===4){
    ui.checking = true;
    const u = await findByPin(a.pin);
    if(u){
      ui.fails=0; spin.target = 200;
      const arm = document.getElementById('arm'); if(arm) arm.classList.add('play');
      const pin = a.pin;
      const target = u.online ? u.id : await upgradeProfile(u, pin);
      if(!target){            // its name is already used online by someone else
        ui.checking=false; a.pin='';
        ui.auth = {mode:'create', name:'', err:`Someone else already uses the name “${u.name}”. Pick another name to move your library online.`};
        render(); return;
      }
      setTimeout(()=>{ ui.checking=false; a.pin=''; signIn(target); location.hash=''; render(); }, reduceMotion ? 0 : 900);
      return;
    }
    ui.checking = false;
    ui.fails++; a.pin=''; a.err='That PIN doesn’t match any account on this device.';
    spin.speed = -420;                                 // record scratch
    if(ui.fails>=5){ ui.fails=0; ui.lockUntil=Date.now()+30000; setTimeout(render,30100); render(); return; }
    updateLogin(); void document.getElementById('dots').offsetWidth; document.getElementById('dots').classList.add('shake');
  }
}

/* ---------- installable app ---------- */
let installPrompt = null;
const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function installBtn(){
  if(standalone()) return '';
  if(installPrompt) return '<button type="button" class="ghost" id="install">Install app</button>';
  if(isIOS) return '<button type="button" class="ghost" id="install-ios">Install app</button>';
  return '';
}
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installPrompt = e; render(); });
window.addEventListener('appinstalled', ()=>{ installPrompt = null; ui.notice = 'Installed. Open Listening Log from your home screen or app list.'; render(); });
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

function brand(){
  return `<a class="brand" href="#" aria-label="Listening Log home"><svg viewBox="0 0 64 64" aria-hidden="true">
    <path class="band" d="M14 38v-6a18 18 0 0 1 36 0v6"/><rect class="cup" x="9" y="34" width="13" height="20" rx="5"/><rect class="cup" x="42" y="34" width="13" height="20" rx="5"/></svg>Listening Log</a>`;
}

/* ---------- render ---------- */
function render(){
  const r = route();
  const act = document.activeElement && document.activeElement.id;
  const pos = act && document.activeElement.selectionStart;
  if(!me){ app.innerHTML = brand() + viewAuth(); if(act){ const el=document.getElementById(act); if(el) el.focus(); } spin.target = SPEEDS[ui.auth.pin.length]||SPEEDS[0]; startSpin(); return; }
  app.innerHTML = topbar() + (r.view==='artist' ? viewArtist(r.id) : r.view==='album' ? viewAlbum(r.id) : viewHome());
  if(act){ const el=document.getElementById(act); if(el){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos); }catch(e){} } }
  if(r.view==='artist' && lib.artists[r.id] && !ui.disco[r.id] && !ui.discoErr[r.id] && !loadingDisco[r.id]) loadDisco(r.id);
  if(r.view==='album' && lib.albums[r.id] && !ui.tracks[r.id] && !loadingTracks[r.id] && !ui.tracksErr) loadTracks(r.id);
}
function part(id, html){ const el=document.getElementById(id); if(el) el.innerHTML=html; }

/* ---------- data loading ---------- */
let searchTimer, searchSeq = 0;
function runSearch(){
  clearTimeout(searchTimer);
  const q = ui.q.trim();
  if(!q){ ui.results=[]; ui.err=''; part('results', resultsHTML()); return; }
  ui.searching = true; part('results', resultsHTML());
  searchTimer = setTimeout(async ()=>{
    const seq = ++searchSeq;
    try{
      const list = await searchArtists(q);
      if(seq!==searchSeq) return;
      ui.results = list; ui.err='';
      artistPictures(list).then(()=>{ if(seq===searchSeq) part('results', resultsHTML()); });
    }catch(e){ if(seq!==searchSeq) return; ui.err='Couldn’t reach the music catalogue. Check your internet, or try turning off an ad blocker for this site.'; }
    ui.searching = false; part('results', resultsHTML());
  }, 300);
}
const loadingDisco = {};
async function loadDisco(id){
  loadingDisco[id] = true;
  try{
    const all = await discography(id);
    const ar = lib && lib.artists[id];
    if(ar && !ar.picture && all.length){ const c = all.slice().sort((a,b)=>String(b.release_date).localeCompare(String(a.release_date)))[0]; ar.picture=c.cover_medium; ar.pictureXL=c.cover_xl; save(); render(); }
    all.sort((a,b)=>String(b.release_date||'').localeCompare(String(a.release_date||'')));
    ui.disco[id] = all; delete ui.discoErr[id];
  }catch(e){ ui.discoErr[id] = 'Couldn’t load this artist’s albums right now.'; }
  loadingDisco[id] = false;
  if(route().id===id) part('disco', discoHTML(id));
}
const loadingTracks = {};
async function loadTracks(id){
  loadingTracks[id] = true;
  try{
    const d = await albumInfo(id);
    ui.tracks[id] = d.tracks;
    ui.tracksErr = '';
    const al = lib.albums[id];
    if(al){ al.nbTracks = d.nb || d.tracks.length; al.duration = d.duration; al.label = d.label || al.label; save(); }
  }catch(e){ ui.tracksErr = 'Couldn’t load the songs right now.'; }
  loadingTracks[id] = false;
  if(route().id===id) render();
}

/* ---------- events (delegated) ---------- */
app.addEventListener('input', e=>{
  if(e.target.id==='q'){ ui.q = e.target.value; runSearch(); }
  if(e.target.id==='aq'){ ui.albumQ = e.target.value; part('disco', discoHTML(route().id)); }
});
app.addEventListener('click', async e=>{
  const b = e.target.closest('button'); if(!b) return;
  const r = route();
  if(b.id==='install' && installPrompt){ const p = installPrompt; installPrompt = null; p.prompt(); try{ await p.userChoice; }catch(err){} render(); return; }
  if(b.id==='install-ios'){ ui.notice = 'To install on iPhone or iPad: tap the Share button in Safari, then “Add to Home Screen”.'; if(!me){ ui.auth.err = ui.notice; } render(); return; }
  if(b.dataset.digit){ pushDigit(b.dataset.digit); return; }
  if(b.id==='pin-back'){ if(ui.checking) return; ui.auth.pin = ui.auth.pin.slice(0,-1); updateLogin(); return; }
  if(b.id==='to-create'){ ui.auth = {mode:'create', pin:'', err:''}; render(); return; }
  if(b.id==='to-login'){ ui.auth = {mode:'login', pin:'', err:''}; render(); return; }
  if(b.id==='to-signin'){ ui.auth = {mode:'signin', pin:'', err:''}; render(); return; }
  if(b.id==='forget'){
    if(!b.classList.contains('armed')){ b.classList.add('armed','danger'); b.textContent='Tap again to remove it here (it stays online)';
      setTimeout(()=>{ if(b.isConnected){ b.classList.remove('armed','danger'); b.textContent='Remove from this device'; } }, 5000); return; }
    const id = me; signOut(); delete store.users[id]; delete store.libs[id]; save(); render(); return;
  }
  if(b.id==='logout'){ signOut(); return; }
  if(b.id==='toggle-themes'){ ui.showThemes = !ui.showThemes; render(); return; }
  if(b.dataset.skin){ store.users[me].skin = b.dataset.skin; store.lastSkin = b.dataset.skin; save(); applySkin(); render(); return; }
  if(b.id==='del-me'){
    if(!b.classList.contains('armed')){
      b.classList.add('armed','danger'); b.textContent='Tap again to delete your account and library everywhere';
      setTimeout(()=>{ if(b.isConnected){ b.classList.remove('armed','danger'); b.textContent='Delete my account'; } }, 5000); return;
    }
    const id = me;
    if(store.users[id].online){
      try{ const db = await connect(); stopSync(); await db.collection('accounts').doc(id).delete(); }
      catch(err){ flash(OFFLINE); return; }
    }
    signOut(); delete store.users[id]; delete store.libs[id]; save(); render(); return;
  }
  if(b.dataset.addArtist){
    const a = ui.results.find(x=>String(x.id)===b.dataset.addArtist); if(!a) return;
    lib.artists[a.id] = {id:String(a.id), name:a.name, picture:a.picture_medium, pictureXL:a.picture_xl, link:a.link, addedAt:Date.now()};
    save(); location.hash = 'artist-'+a.id; return;
  }
  if(b.dataset.addAlbum){
    const list = ui.disco[r.id]||[]; const x = list.find(y=>String(y.id)===b.dataset.addAlbum); if(!x) return;
    lib.albums[x.id] = {id:String(x.id), artistId:r.id, artistName:(lib.artists[r.id]||{}).name, title:x.title, cover:x.cover_medium, coverXL:x.cover_xl,
      date:x.release_date, type:x.record_type, link:x.link, addedAt:Date.now()};
    save(); render();
    // fetch the track count in the background so the counts are right
    try{ const d = await albumInfo(x.id); const al=lib.albums[x.id]; if(al){ al.nbTracks=d.nb; al.duration=d.duration; al.label=d.label; save(); if(route().id===r.id) render(); } }catch(err){}
    return;
  }
  if(b.dataset.type){ ui.type = b.dataset.type; render(); return; }
  if(b.id==='retry-disco'){ delete ui.discoErr[r.id]; part('disco', discoHTML(r.id)); loadDisco(r.id); return; }
  if(b.id==='retry-tracks'){ ui.tracksErr=''; render(); return; }
  if(b.id==='del-artist' || b.id==='del-album'){
    if(!b.classList.contains('armed')){
      b.classList.add('armed'); const old=b.textContent; b.textContent='Tap again to remove';
      setTimeout(()=>{ if(b.isConnected){ b.classList.remove('armed'); b.textContent=old; } }, 4000); return;
    }
    if(b.id==='del-artist'){ for(const al of myAlbums(r.id)) delete lib.albums[al.id]; delete lib.artists[r.id]; save(); location.hash=''; }
    else { const al=lib.albums[r.id]; delete lib.albums[r.id]; save(); location.hash = al ? 'artist-'+al.artistId : ''; }
    return;
  }
  if(b.id==='export'){
    const blob = new Blob([JSON.stringify(lib,null,2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'listening-log-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000); return;
  }
  if(b.id==='import'){ document.getElementById('import-file').click(); return; }
});
document.getElementById('import-file').addEventListener('change', async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!d || typeof d.artists!=='object' || typeof d.albums!=='object') throw 0;
    lib.artists = {...lib.artists, ...d.artists}; lib.albums = {...lib.albums, ...d.albums}; save();
    flash(`Restored ${plural(Object.keys(d.artists).length,'artist')} and ${plural(Object.keys(d.albums).length,'album')}.`);
  }catch(err){ flash('That file isn’t a Listening Log backup.'); }
  e.target.value = '';
});

app.addEventListener('submit', async e=>{
  if(e.target.id==='f-signin'){
    e.preventDefault(); if(ui.busy) return;
    const name = document.getElementById('s-name').value.trim(), pin = document.getElementById('s-pin').value;
    const fail = m => { ui.busy=false; ui.auth = {mode:'signin', name, pin:'', err:m}; render(); };
    if(!name) return fail('Enter your name.');
    if(!/^\d{4}$/.test(pin)) return fail('The PIN is 4 digits.');
    ui.busy = true; render();
    try{
      const key = await accountKey(name, pin);
      if(store.users[key]){ ui.busy=false; ui.auth={mode:'login',pin:'',err:''}; signIn(key); location.hash=''; render(); return; }
      const db = await connect();
      const snap = await db.collection('accounts').doc(key).get();
      if(!snap.exists) return fail('No account matches that name and PIN.');
      remember(key, snap.data());
      ui.busy=false; ui.auth = {mode:'login', pin:'', err:''};
      signIn(key); location.hash=''; render();
    }catch(err){ fail(OFFLINE); }
    return;
  }
  if(e.target.id!=='f-create') return;
  e.preventDefault(); if(ui.busy) return;
  const name = document.getElementById('c-name').value.trim();
  const p1 = document.getElementById('c-pin').value, p2 = document.getElementById('c-pin2').value;
  const fail = m => { ui.busy=false; ui.auth = {mode:'create', name, pin:'', err:m}; render(); };
  if(!name) return fail('Enter your name.');
  if(!/^\d{4}$/.test(p1)) return fail('The PIN must be exactly 4 digits.');
  if(p1!==p2) return fail('The two PINs don’t match. Type them again.');
  // bring along a library from this device: an older profile being moved online, or the very first single-user version
  let library = {artists:{}, albums:{}}, skin = 'synth', carryFrom = null;
  if(ui.carry && store.users[ui.carry.from]){ carryFrom = ui.carry.from; library = store.libs[carryFrom] || library; skin = store.users[carryFrom].skin || skin; }
  else if(!store.migrated){
    try{ const old = JSON.parse(localStorage.getItem(OLD_KEY)||'null'); if(old && Object.keys(old.artists||{}).length) library = {artists:old.artists||{}, albums:old.albums||{}}; }catch(err){}
  }
  ui.busy = true; render();
  let r;
  try{ r = await createAccount(name, p1, library, skin); }catch(err){ return fail(OFFLINE); }
  if(r.status==='taken') return fail('That name is already used. Add your surname or a nickname.');
  if(r.status==='mine') return fail('You already have an account with this name and PIN. Tap “Already have an account? Sign in”.');
  if(carryFrom){ delete store.users[carryFrom]; delete store.libs[carryFrom]; ui.carry = null; }
  store.migrated = true;
  remember(r.key, r.data);
  ui.busy=false; ui.auth = {mode:'login', pin:'', err:''};
  signIn(r.key); location.hash=''; render();
});
document.addEventListener('keydown', e=>{
  if(me || ui.auth.mode!=='login' || Object.keys(store.users).length===0) return;
  if(e.target.closest && e.target.closest('input,textarea')) return;
  if(/^\d$/.test(e.key)) pushDigit(e.key);
  else if(e.key==='Backspace' && !ui.checking){ ui.auth.pin = ui.auth.pin.slice(0,-1); updateLogin(); }
});

if(me && store.users[me]) signIn(me); else me = null;
connect().catch(()=>{});            // load the database code early so signing in feels instant
applySkin();
render();
})();
</script>
